name: Python application

on:
  push:
    branches:
      - main   # Alebo iná vetva, ktorú používaš na deploy

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'  # Zmeniť na verziu Pythonu, ktorú používaš

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: List installed packages
      run: pip list

    - name: Check for test files
      run: |
        echo "Listing test files"
        ls -al

    - name: Run tests with error details
      run: |
        echo "Running tests"
        pytest --maxfail=1 --disable-warnings -v --tb=short
