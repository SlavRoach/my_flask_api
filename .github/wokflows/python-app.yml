name: Run Tests

on:
  push:
    branches:
      - main  # alebo master, záleží, aký máš hlavný branch
  pull_request:
    branches:
      - main  # alebo master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'  # Nastav správnu verziu Pythonu

      - name: Install dependencies
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt

      - name: Run tests
        run: |
          . venv/bin/activate
          python -m unittest discover tests/
